<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>后台管理 - 智能儿童床</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Microsoft YaHei', sans-serif; background: #1a1a2e; color: #eee; min-height: 100vh; }
        header { background: #16213e; padding: 16px 24px; display: flex; justify-content: space-between; align-items: center; }
        header h1 { font-size: 20px; color: #e94560; }
        .conn-status { font-size: 13px; padding: 4px 12px; border-radius: 12px; }
        .conn-status.online { background: #1a8a1a; }
        .conn-status.offline { background: #8a1a1a; }
        main { max-width: 600px; margin: 24px auto; padding: 0 16px; }
        .panel { background: #16213e; border-radius: 12px; padding: 20px; margin-bottom: 20px; }
        .panel h2 { font-size: 16px; margin-bottom: 16px; color: #e94560; }
        .btn { display: inline-block; padding: 12px 28px; border: none; border-radius: 8px; font-size: 16px; cursor: pointer; margin: 6px; transition: all .2s; }
        .btn:hover { opacity: .85; transform: translateY(-1px); }
        .btn-sleep { background: #7b68ee; color: #fff; }
        .btn-wake  { background: #ffa500; color: #fff; }
        .btn-cry   { background: #e94560; color: #fff; }
        .btn-feed  { background: #2ecc71; color: #fff; }
        .btn-story { background: #3498db; color: #fff; }
        .log-panel { max-width: 600px; margin: 0 auto; padding: 0 16px 24px; }
        .log-panel h3 { margin-bottom: 8px; }
        #log-list { background: #0f0f23; border-radius: 8px; padding: 12px; max-height: 300px; overflow-y: auto; font-size: 13px; font-family: Consolas, monospace; }
        #log-list div { padding: 4px 0; border-bottom: 1px solid #1a1a3e; }
        .log-time { color: #888; margin-right: 8px; }
        .log-tx { color: #e94560; }
        .log-rx { color: #2ecc71; }
    </style>
</head>
<body>
    <header>
        <h1>后台管理</h1>
        <span id="conn-status" class="conn-status offline">未连接</span>
    </header>

    <main>
        <section class="panel">
            <h2>场景模拟</h2>
            <button class="btn btn-sleep" onclick="sendCmd('sleep', 1)">😴 睡着</button>
            <button class="btn btn-wake"  onclick="sendCmd('sleep', 0)">🔔 醒来</button>
            <button class="btn btn-cry"   onclick="sendCmd('cry', 1)">😢 哭闹</button>
            <button class="btn btn-feed"  onclick="sendCmd('feed', 1)">🍼 喂奶提醒</button>
            <button class="btn btn-story" onclick="sendCmd('story', 1)">📖 播放故事</button>
        </section>
    </main>

    <section class="log-panel">
        <h3>消息日志</h3>
        <div id="log-list"></div>
    </section>

    <script>
        const WS_URL = 'ws://60.205.235.150:9001';
        let ws = null;
        let reconnectTimer = null;

        function now() {
            const d = new Date();
            return d.toLocaleTimeString('zh-CN', { hour12: false });
        }

        function addLog(text, cls) {
            const div = document.createElement('div');
            div.innerHTML = `<span class="log-time">${now()}</span><span class="${cls}">${text}</span>`;
            const list = document.getElementById('log-list');
            list.insertBefore(div, list.firstChild);
            if (list.children.length > 100) list.removeChild(list.lastChild);
        }

        function setStatus(online) {
            const el = document.getElementById('conn-status');
            el.textContent = online ? '已连接' : '未连接';
            el.className = 'conn-status ' + (online ? 'online' : 'offline');
        }

        function sendCmd(cmd, value) {
            const msg = JSON.stringify({ topic: 'bed/control', payload: JSON.stringify({ cmd: cmd, value: value }) });
            if (ws && ws.readyState === WebSocket.OPEN) {
                ws.send(msg);
                addLog('发送 → bed/control: ' + cmd + '=' + value, 'log-tx');
            } else {
                addLog('发送失败: 未连接', 'log-tx');
            }
        }

        function connect() {
            if (reconnectTimer) { clearTimeout(reconnectTimer); reconnectTimer = null; }
            addLog('正在连接...', 'log-rx');
            ws = new WebSocket(WS_URL);

            ws.onopen = function () {
                setStatus(true);
                addLog('已连接到服务器', 'log-rx');
                // 订阅话题
                ws.send(JSON.stringify({ topic: 'bed/status', payload: '' }));
                ws.send(JSON.stringify({ topic: 'bed/heartbeat', payload: '' }));
                addLog('已订阅 bed/status, bed/heartbeat', 'log-rx');
            };

            ws.onmessage = function (e) {
                try {
                    const msg = JSON.parse(e.data);
                    const topic = msg.topic || '';
                    const payload = msg.payload || '';
                    if (topic === 'bed/status') {
                        try {
                            const data = JSON.parse(payload);
                            addLog('状态: 温度' + data.env_temp + '°C 湿度' + data.env_hum + '% AQI' + data.aqi + ' 心率' + data.heart + ' 呼吸' + data.breath, 'log-rx');
                        } catch (ex) {
                            addLog('[' + topic + '] ' + payload, 'log-rx');
                        }
                    } else if (topic === 'bed/heartbeat') {
                        addLog('心跳: 设备在线', 'log-rx');
                    } else {
                        addLog('[' + topic + '] ' + payload, 'log-rx');
                    }
                } catch (ex) {
                    addLog('收到: ' + e.data, 'log-rx');
                }
            };

            ws.onerror = function () {
                addLog('连接错误', 'log-rx');
            };

            ws.onclose = function () {
                setStatus(false);
                addLog('连接断开，3秒后重连...', 'log-rx');
                reconnectTimer = setTimeout(connect, 3000);
            };
        }

        connect();
    </script>
</body>
</html>
