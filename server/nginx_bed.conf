# 添加到 /etc/nginx/conf.d/bed.conf 或 http 块内
#
# 静态网页:    /var/www/bed/
# 音频文件:    /source/
# WebSocket:   /mqtt → 127.0.0.1:9001
#
server {
    listen 80;
    server_name _;

    root /var/www/bed;
    index index.html;

    # Web 静态文件
    location / {
        try_files $uri $uri/ =404;
    }

    # 音频文件（只读）
    location /source/ {
        alias /source/;
        autoindex on;           # 允许浏览器直接浏览文件
        add_header Cache-Control "public, max-age=3600";
    }

    # WebSocket 代理（可选，浏览器也可直连 9001）
    location /mqtt {
        proxy_pass http://127.0.0.1:9001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_read_timeout 86400s;
    }
}
